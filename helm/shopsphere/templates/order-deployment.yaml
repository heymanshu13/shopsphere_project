apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: order-service
    app.kubernetes.io/part-of: shopsphere
spec:
  replicas: {{ .Values.services.order.replicas }}

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/part-of: shopsphere

    spec:
      serviceAccountName: order-service

      containers:
        - name: order-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.order.image.repository }}:{{ .Values.services.order.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: USER_SERVICE_URL

            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: PRODUCT_SERVICE_URL

            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: PAYMENT_SERVICE_URL

            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: NOTIFICATION_SERVICE_URL

            - name: APP_ENV
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secret
                  key: APP_ENV

          envFrom:
            - configMapRef:
                name: shopsphere-config

            - secretRef:
                name: shopsphere-secret

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP

  selector:
    app: order-service

  ports:
    - port: 8000
      targetPort: 8000
