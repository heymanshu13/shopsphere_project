apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-to-services
  namespace: shopsphere
spec:
  podSelector:
    matchLabels:
      app: order-service

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: user-service

      ports:
        - protocol: TCP
          port: 8000

    - to:
        - podSelector:
            matchLabels:
              app: product-service

      ports:
        - protocol: TCP
          port: 8000

    - to:
        - podSelector:
            matchLabels:
              app: payment-service

      ports:
        - protocol: TCP
          port: 8000

    - to:
        - podSelector:
            matchLabels:
              app: notification-service

      ports:
        - protocol: TCP
          port: 8000
