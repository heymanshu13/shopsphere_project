apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Values.global.namespace }}

  labels:
    app: user-service
    app.kubernetes.io/managed-by: Helm

spec:
  replicas: {{ .Values.services.user.replicas }}

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/part-of: shopsphere

    spec:
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: user-service-secrets

      containers:

        - name: user-service

          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.user.image.repository }}:{{ .Values.services.user.image.tag }}"

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:

            - configMapRef:
                name: shopsphere-config

            - secretRef:
                name: shopsphere-secret

            - secretRef:
                name: shopsphere-db

          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app.kubernetes.io/part-of: shopsphere
  namespace: {{ .Values.global.namespace }}

spec:
  type: ClusterIP

  selector:
    app: user-service

  ports:
    - name: http
      port: 8000
      targetPort: 8000
