apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/heymanshu13/shopsphere_project.git
    targetRevision: main
    path: helm/shopsphere

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: shopsphere

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
