apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-green
  namespace: {{ .Values.global.namespace }}
  labels:
    app: user-service-green
    app.kubernetes.io/part-of: shopsphere
spec:
  replicas: {{ .Values.services.user.replicas }}
  selector:
    matchLabels:
      app: user-service-green
  template:
    metadata:
      labels:
        app: user-service-green
        app.kubernetes.io/part-of: shopsphere
    spec:
      serviceAccountName: user-service
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: user-service-green

        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: user-service-green

      containers:
        - name: user-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.user.image.repository }}:{{ .Values.services.user.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: shopsphere-config
            - secretRef:
                name: shopsphere-secret
            - secretRef:
                name: shopsphere-db
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-green-preview
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: shopsphere
spec:
  type: ClusterIP
  selector:
    app: user-service-green
  ports:
    - name: http
      port: 8000
      targetPort: 8000
