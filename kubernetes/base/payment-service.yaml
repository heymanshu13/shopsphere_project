apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: shopsphere
spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service

          image: 278177224853.dkr.ecr.ap-south-1.amazonaws.com/shopsphere-payment-service:28

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: shopsphere-config
            - secretRef:
                name: shopsphere-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: shopsphere
spec:
  type: ClusterIP

  selector:
    app: payment-service

  ports:
    - port: 8000
      targetPort: 8000
