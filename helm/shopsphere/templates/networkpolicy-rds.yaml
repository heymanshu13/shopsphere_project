apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rds-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - user-service
          - user-service-green
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.11.0/24
        - ipBlock:
            cidr: 10.0.12.0/24
      ports:
        - protocol: TCP
          port: 5432
