{{- $namespace := .Values.global.namespace }}
{{- range $service := list "user-service" "user-service-green" "product-service" "order-service" "payment-service" "notification-service" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $service }}
  namespace: {{ $namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $service }}
{{- end }}
